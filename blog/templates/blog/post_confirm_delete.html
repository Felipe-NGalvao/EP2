{% extends 'base.html' %}
{% block title %}
    Remover post
{% endblock title %}
{% block content %}
    <h2>Remover post</h2>
    <form action="" method="post">
        {% csrf_token %}
        <p>Você tem certeza que deseja remover o post "{{ post.title }}"?</p>
        <button type="submit">Sim, remover</button>
    </form>
    <p>
        <a href="{% url 'blog:detail' post.pk %}">Não, voltar</a>
    </p>
{% endblock content %}
