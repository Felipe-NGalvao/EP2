{% extends 'base.html' %}
{% block title %}
    Comentar
{% endblock title %}
{% block content %}
    <h2>Comentar em "{{ post.title }}"</h2>
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Publicar comentário</button>
    </form>
    <p>
        <a href="{% url 'blog:detail' post.pk %}">Voltar para o post</a>
    </p>
{% endblock content %}
