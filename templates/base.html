{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}{% endblock %}
            | Desinformados
        </title>
        <link href="https://fonts.googleapis.com/css?family=Inter&display=swap"
              rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
    </head>
    <body>
        <header id="cabecalho-principal">
            <a href="{% url 'index' %}">
                <img src="{% static 'logo.png' %}">
            </a>
            <nav id="navegacao-principal">
                <ul>
                    <li>
                        <a href="{% url 'about' %}">Sobre</a>
                    </li>
                    <li>
                        <a href="{% url 'blog:index' %}">Posts</a>
                    </li>
                </ul>
            </nav>
        </header>
        <main id="conteiner-principal">
            {% block content %}
            {% endblock content %}
        </main>
        <footer id="rodape-principal">
            <p>
                <small>Desinformados 2026 - O melhor site des informações do mundo (the world)</small>
            </p>
        </footer>
    </body>
</html>
